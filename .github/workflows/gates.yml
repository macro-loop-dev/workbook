name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    # The pre-commit hook in .githooks/ already runs gitleaks, but hooks are
    # local, opt-in and bypassable with --no-verify. This is the copy that
    # cannot be skipped. It is the first green check you will ever see, in
    # chapter 4. A "checks" job (typecheck, lint, test, build) joins it in
    # chapter 8, once there is a package.json for it to check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The same command as .githooks/pre-commit, minus --staged so it reads
      # every commit instead of what is about to be one. Downloaded rather
      # than run as an action: gitleaks-action needs a paid licence key for
      # repositories owned by an organisation, and this does not.
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact -v
